<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post — tensao no trapezio</title>
<style>
@font-face{font-family:'Fraunces';font-style:normal;font-weight:300 700;font-display:block;
  src:url('../reels/fonts/fraunces.woff2') format('woff2')}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:300 700;font-display:block;
  src:url('../reels/fonts/fraunces-italic.woff2') format('woff2')}
@font-face{font-family:'Work Sans';font-style:normal;font-weight:300 700;font-display:block;
  src:url('../reels/fonts/worksans.woff2') format('woff2')}

:root{
  --ink:#1b1a17; --cream:#f7f4ee; --cream-alt:#efe9df; --sand:#d9d0bf;
  --gold:#a9895f; --gold-deep:#8a6a3f; --muted:#6b6558;
  --display:'Fraunces',Georgia,serif; --body:'Work Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--cream)}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#art{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--cream)}

/* ---------- foto ---------- */
.shot{position:absolute;top:0;left:0;width:1080px;height:748px;overflow:hidden}
.shot img{
  width:100%;height:100%;object-fit:cover;object-position:64% 40%;display:block;
  filter:brightness(1.04) saturate(1.04) contrast(1.02);
}
.shot .grade{
  position:absolute;inset:0;
  background:
    radial-gradient(78% 66% at 50% 42%, rgba(27,26,23,0) 56%, rgba(27,26,23,.20) 100%),
    linear-gradient(180deg, rgba(27,26,23,.16) 0%, rgba(27,26,23,0) 22%, rgba(27,26,23,0) 74%, rgba(27,26,23,.14) 100%);
}
/* selo discreto no alto da foto, para a arte se sustentar sozinha se for repostada */
.tag{
  position:absolute;top:52px;left:56px;
  display:flex;align-items:center;gap:14px;
  background:rgba(27,26,23,.42);border:1px solid rgba(247,244,238,.28);
  border-radius:999px;padding:12px 24px;
  font-size:21px;letter-spacing:.22em;text-transform:uppercase;color:rgba(247,244,238,.94);font-weight:400;
}

/* ---------- painel ---------- */
.panel{position:absolute;top:748px;left:0;width:1080px;height:602px;background:var(--cream)}
.panel .glow{
  position:absolute;inset:0;
  background:radial-gradient(70% 90% at 22% 10%, rgba(217,208,191,.42) 0%, rgba(247,244,238,0) 70%);
}
.wrap{position:absolute;left:76px;right:76px;top:0}
.kicker{
  margin-top:64px;font-size:23px;letter-spacing:.32em;text-transform:uppercase;
  color:var(--gold-deep);font-weight:400;
}
h1,h2{font-family:var(--display);font-weight:300;font-size:78px;line-height:1.03;letter-spacing:-.022em}
h1{margin-top:22px;color:var(--ink)}
h2{font-style:italic;font-weight:500;color:var(--gold-deep);margin-top:4px}
.rule{width:142px;height:2px;background:var(--gold);margin-top:38px}
.sub{
  margin-top:26px;max-width:920px;font-size:28px;line-height:1.5;color:var(--muted);font-weight:300;
}
.sub b{font-weight:500;color:var(--ink)}

/* ---------- rodape ---------- */
.foot{
  position:absolute;left:76px;right:76px;bottom:52px;
  display:flex;align-items:center;
  border-top:1px solid var(--sand);padding-top:26px;
}
.who{font-size:26px;color:var(--ink);font-weight:500;letter-spacing:-.005em}
.who span{display:block;font-size:22px;color:var(--muted);font-weight:300;letter-spacing:.04em;margin-top:3px}
.where{margin-left:auto;text-align:right;font-size:22px;color:var(--muted);font-weight:300;line-height:1.45}
.where b{display:block;font-weight:500;color:var(--gold-deep);letter-spacing:.14em;text-transform:uppercase;font-size:20px}

/* ---------- acabamento ---------- */
#grain{
  position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
  background-size:220px 220px;
}
</style>
</head>
<body>
<div id="art">
  <div class="shot">
    <img src="../../assets/img/massage-3.jpg" alt="Terezinha trabalhando a musculatura das costas de uma cliente">
    <div class="grade"></div>
    <div class="tag">Ventosaterapia</div>
  </div>

  <div class="panel">
    <div class="glow"></div>
    <div class="wrap">
      <div class="kicker">O que a ventosa faz de diferente</div>
      <h1>Massagem comprime.</h1>
      <h2>A ventosa levanta.</h2>
      <div class="rule"></div>
      <p class="sub">Press&atilde;o negativa: em vez de empurrar o m&uacute;sculo,
        <b>a ventosa puxa o tecido</b> &mdash; e chega no n&oacute; que o alongamento n&atilde;o alcan&ccedil;a.</p>
    </div>
    <div class="foot">
      <div class="who">Terezinha Ramos<span>Massoterapeuta &middot; clientes desde 2009</span></div>
      <div class="where"><b>Agende</b>(51) 98958-2730</div>
    </div>
  </div>

  <div id="grain"></div>
</div>
<script>
  window.__size = { width: 1080, height: 1350 };
  (async () => {
    await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
    await document.fonts.load('300 78px Fraunces');
    await document.fonts.load('italic 500 78px Fraunces');
    await document.fonts.load('400 29px "Work Sans"');
    await document.fonts.ready;
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    window.__ready = true;
  })();
</script>
</body>
</html>
