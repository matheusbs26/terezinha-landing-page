# Configuração da análise automática do SonarQube Cloud.
#
# Exclusão SÓ da detecção de duplicação (copy-paste), não da análise: estas
# páginas continuam passando pelas regras de qualidade e segurança de HTML.
# São as dez páginas escritas por tools/build.js a partir de um template
# único (tools/services.js), então repetem cabeçalho, rodapé, blocos de
# serviço e JSON-LD por construção. A duplicação real fica na fonte, que
# segue analisada (tools/), assim como as páginas mantidas à mão (index.html
# e politica-de-privacidade/index.html).
#
# A análise automática não aceita curingas: cada caminho é listado. Ao criar
# uma página nova pelo build.js, acrescente-a aqui.
sonar.cpd.exclusions=agendar/index.html,drenagem-linfatica/index.html,drenagem-pos-operatoria/index.html,massagem-modeladora/index.html,massagem-pedras-quentes/index.html,massagem-relaxante/index.html,massagem-terapeutica/index.html,reflexologia-podal/index.html,reiki/index.html,ventosaterapia/index.html
